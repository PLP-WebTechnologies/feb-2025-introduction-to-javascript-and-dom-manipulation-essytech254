<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Page with JavaScript</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1 id="main-heading">Welcome to My Dynamic Page</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <p id="dynamic-text">This text will change when you click the button.</p>
      <button id="change-text-btn">Change Text</button>
    </section>

    <section>
      <button id="toggle-style-btn">Change Background</button>
    </section>

    <section>
      <button id="add-element-btn">Add Element</button>
      <button id="remove-element-btn">Remove Element</button>
      <div id="element-container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Dynamic Page Example</p>
  </footer>
</body>
</html>
